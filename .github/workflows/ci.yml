name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: git ls-files 'src/**/*.cpp' 'src/**/*.h' 'tests/**/*.cpp' | xargs -r clang-format --dry-run --Werror
      - name: core must stay UI-free
        run: |
          if grep -rn -E 'QWidget|QTextEdit|QApplication|Qt6::Widgets' src/core; then
            echo 'src/core must not depend on Qt Widgets'; exit 1
          fi

  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcmark-gfm-dev libcmark-gfm-extensions-dev qt6-base-dev
      - run: cmake --preset linux-gcc
      - run: cmake --build build/linux-gcc
      - run: ctest --test-dir build/linux-gcc --output-on-failure

  core-without-qt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcmark-gfm-dev libcmark-gfm-extensions-dev
      - run: cmake -S . -B build/core -D TYPIST_BUILD_APP=OFF -D TYPIST_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/core
      - run: ctest --test-dir build/core --output-on-failure

  core-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmark-gfm qt@6
      - run: export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)" && cmake --preset macos-clang
      - run: cmake --build build/macos-clang
      - run: ctest --test-dir build/macos-clang --output-on-failure

  windows:
    # Verified locally with MSYS2 mingw64: gcc 16.2, CMake 4.4.4, Qt 6.12.0,
    # plus cmark-gfm 0.29.0.gfm.13 built from source into /usr/local.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-qt6-base
      - name: Build and install cmark-gfm
        shell: msys2 {0}
        run: |
          curl -L -o cmark.tar.gz https://github.com/github/cmark-gfm/archive/refs/tags/0.29.0.gfm.13.tar.gz
          tar xzf cmark.tar.gz
          cmake -S cmark-gfm-0.29.0.gfm.13 -B cmark-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build cmark-build
          cmake --install cmark-build
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=/mingw64;/usr/local"
      - name: Build
        shell: msys2 {0}
        run: cmake --build build/mingw
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build/mingw --output-on-failure
      - name: Performance gate
        shell: msys2 {0}
        run: |
          QT_QPA_PLATFORM=offscreen ./build/mingw/tests/perf/perf_bench.exe | tee perf.log
          grep -c 'fidelity=ok' perf.log
          awk '/realistic/ { for (i = 1; i <= NF; ++i) if ($i ~ /^total_ms=/) { split($i, a, "="); if (a[2] + 0 > 250) { print "realistic over budget: " a[2]; exit 1 } } }' perf.log
          awk '/tableheavy/ { for (i = 1; i <= NF; ++i) if ($i ~ /^total_ms=/) { split($i, a, "="); if (a[2] + 0 > 300) { print "tableheavy over budget: " a[2]; exit 1 } } }' perf.log
      - name: Translation coverage
        shell: msys2 {0}
        run: |
          if ! diff <(grep -o 'tr("[^"]*")' src/ui/MainWindow.cpp | sort -u | wc -l) <(grep -c '<source>' translations/typist_zh.ts); then
            echo 'translations/typist_zh.ts must cover every tr() string in MainWindow.cpp'
            exit 1
          fi

  i18n:
    # .qm catalogs are built here because Qt Linguist is not installed on the
    # development machine; the app loads typist_<lang>.qm at runtime.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-l10n-tools
      - name: Refresh source strings
        run: lupdate -tr strict src/ui/*.cpp -ts translations/typist_zh.ts
      - name: Compile catalogs
        run: lrelease translations/*.ts
      - run: test -s translations/typist_zh.qm
      - uses: actions/upload-artifact@v4
        with:
          name: translations
          path: translations/*.qm

  windows-msvc:
    # MSVC is exercised only in CI; the development machine has no cl.exe.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: Bahrdot/setup-qt6@v1
        with:
          qt_version: '6.12.0'
          qt_components: 'qtbase'
      - name: Build cmark-gfm
        shell: bash
        run: |
          curl -L -o cmark.tar.gz https://github.com/github/cmark-gfm/archive/refs/tags/0.29.0.gfm.13.tar.gz
          tar xzf cmark.tar.gz
          cmake -S cmark-gfm-0.29.0.gfm.13 -B cmark-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=cmark-install -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build cmark-build --config Release
          cmake --install cmark-build --config Release
      - name: Configure
        run: cmake --preset windows-msvc -DCMAKE_PREFIX_PATH="cmark-install"
      - name: Build
        run: cmake --build build/windows-msvc --config Release
      - name: Test
        run: ctest --test-dir build/windows-msvc --output-on-failure

