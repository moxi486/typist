name: release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'CMakeLists.txt'
      - 'src/ui/CMakeLists.txt'
      - 'packaging/**'
      - 'tests/packaging/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
      - name: Build and install cmark-gfm
        shell: msys2 {0}
        run: |
          curl -fL --retry 3 -o cmark.tar.gz https://github.com/github/cmark-gfm/archive/refs/tags/0.29.0.gfm.13.tar.gz
          tar xzf cmark.tar.gz
          cmake -S cmark-gfm-0.29.0.gfm.13 -B cmark-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMARK_SHARED=OFF -DCMARK_STATIC=ON -DCMARK_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build cmark-build
          cmake --install cmark-build
      - name: Configure and build
        shell: msys2 {0}
        run: |
          qt_prefix="$(cygpath -m /mingw64)"
          cmark_prefix="$(cygpath -m /usr/local)"
          cmake -S . -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$qt_prefix;$cmark_prefix"
          cmake --build build/mingw
      - name: Compile translation catalogs
        shell: msys2 {0}
        run: /mingw64/bin/lrelease translations/*.ts
      - name: Stage the distribution tree
        shell: msys2 {0}
        run: |
          cmake --install build/mingw --prefix "$(cygpath -m "$PWD/stage")"
          windeployqt --no-translations --compiler-runtime --include-plugins qoffscreen stage/bin/typist.exe
          cmake "-DSTAGE_DIR=$(cygpath -m "$PWD/stage")" "-DMINGW_BIN=$(cygpath -m /mingw64/bin)" \
            -P packaging/windows/deploy-runtime.cmake
      - name: Smoke test the deployed application
        timeout-minutes: 1
        shell: pwsh
        run: |
          $env:PATH = "$PWD\stage\bin;$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          & .\stage\bin\typist.exe --bench-repaint
          if ($LASTEXITCODE -ne 0) { throw 'The deployed application failed to start' }
      - name: Sign the binary when a certificate is configured
        if: startsWith(github.ref, 'refs/tags/v')
        shell: msys2 {0}
        env:
          SIGNTOOL: ${{ vars.SIGNTOOL_PATH }}
          PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
        run: |
          if [ -n "$PFX" ] && [ -n "$SIGNTOOL" ]; then
            "$SIGNTOOL" sign /fd SHA-256 /f "$PFX" stage/bin/typist.exe
          else
            echo 'no signing certificate configured; shipping unsigned'
          fi
      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.1.0' }
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          $stageDir = Join-Path $PWD 'stage'
          & $makensis /NOCD "/DSTAGE_DIR=$stageDir" "/DVERSION=$ver" packaging\windows\typist.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Move-Item -LiteralPath "Typist-$ver-win64-installer.exe" -Destination dist
      - name: Bundle and hash
        shell: pwsh
        run: |
          Compress-Archive -Path stage\* -DestinationPath dist\Typist-win64.zip -Force
          Get-ChildItem -Path dist\*.zip, dist\*-installer.exe -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } | Set-Content dist\checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: typist-windows
          if-no-files-found: error
          path: |
            dist/Typist-win64.zip
            dist/Typist-*-win64-installer.exe
            dist/checksums.txt

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcmark-gfm-dev libcmark-gfm-extensions-dev qt6-base-dev qt6-l10n-tools rpm
      - name: Compile translation catalogs
        run: /usr/lib/qt6/bin/lrelease translations/*.ts
      - run: cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/linux --parallel 2
      - name: Package deb, rpm and portable tarball
        run: cpack --config build/linux/CPackConfig.cmake -G "DEB;RPM;TGZ" -C Release -B dist
      - name: Stage the AppDir
        run: DESTDIR="$PWD/stage/appimage" cmake --install build/linux --prefix /usr
      - name: Build AppImage with linuxdeploy
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QMAKE: /usr/bin/qmake6
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          ARCH: x86_64
          OUTPUT: ${{ github.workspace }}/dist/Typist-x86_64.AppImage
        run: |
          curl -fL --retry 3 -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 -o linuxdeploy-plugin-qt.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          ./linuxdeploy.AppImage --appdir stage/appimage \
            --executable stage/appimage/usr/bin/typist --plugin qt \
            --desktop-file packaging/linux/typist.desktop \
            --icon-file packaging/linux/typist.png --output appimage
      - name: Smoke test the AppImage
        timeout-minutes: 1
        run: APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./dist/Typist-x86_64.AppImage --bench-repaint
      - name: Hash
        run: ( cd dist && sha256sum Typist-* ) > dist/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: typist-linux
          if-no-files-found: error
          path: |
            dist/Typist-*.deb
            dist/Typist-*.rpm
            dist/Typist-*.tar.gz
            dist/Typist-*.AppImage
            dist/checksums.txt

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          cache: true
      - name: Build and install static cmark-gfm
        run: |
          curl -fL --retry 3 -o cmark.tar.gz https://github.com/github/cmark-gfm/archive/refs/tags/0.29.0.gfm.13.tar.gz
          tar xzf cmark.tar.gz
          cmake -S cmark-gfm-0.29.0.gfm.13 -B cmark-build -DCMAKE_BUILD_TYPE=Release \
            -DCMARK_SHARED=OFF -DCMARK_STATIC=ON -DCMARK_TESTS=OFF \
            "-DCMAKE_INSTALL_PREFIX=$PWD/cmark-install" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build cmark-build --parallel 2
          cmake --install cmark-build
      - name: Compile translation catalogs
        run: '"$QT_ROOT_DIR/bin/lrelease" translations/*.ts'
      - name: Configure
        run: cmake --preset macos-clang -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR;$PWD/cmark-install"
      - run: cmake --build build/macos-clang --parallel 2
      - name: Deploy Qt into the application bundle
        run: |
          bundle=build/macos-clang/src/ui/Typist.app
          "$QT_ROOT_DIR/bin/macdeployqt" "$bundle" -always-overwrite -codesign=-
          cp "$QT_ROOT_DIR/plugins/platforms/libqoffscreen.dylib" "$bundle/Contents/PlugIns/platforms/"
          codesign --force --deep --sign - "$bundle"
          codesign --verify --deep --strict "$bundle"
      - name: Smoke test the deployed application
        timeout-minutes: 1
        run: env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH QT_QPA_PLATFORM=offscreen build/macos-clang/src/ui/Typist.app/Contents/MacOS/Typist --bench-repaint
      - name: Package dmg and portable tarball
        run: cpack --config build/macos-clang/CPackConfig.cmake -G "DragNDrop;TGZ" -C Release -B dist
      - name: Hash
        run: ( cd dist && shasum -a 256 Typist-* ) > dist/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: typist-macos
          if-no-files-found: error
          path: |
            dist/Typist-*.dmg
            dist/Typist-*.tar.gz
            dist/checksums.txt

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: typist-*
          path: artifacts
      - name: Consolidate checksums and the update feed
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-validation' }}
        run: python3 packaging/prepare_release.py --artifacts artifacts --output out --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: typist-release
          if-no-files-found: error
          path: out/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          fail_on_unmatched_files: true
          files: |
            out/*
          body: |
            Typist 桌面版发布包：Windows zip 与 NSIS 安装器（含 Qt 运行时 DLL）、Linux deb/rpm/tar.gz/AppImage、macOS dmg/tar.gz。
            每个包都有 SHA-256（checksums.txt），下载后先核对哈希再安装。
            未配置签名证书时二进制未签名（见 docs/Release.md）
