<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>从网页到写作 / Import to write</title></head>
<body>
<h1 id="begin">从网页到写作</h1>
<p>把 <strong>重点</strong>、<em>语气</em> 和 <code>代码</code> 转成可编辑的 Markdown。<a href="#steps">跳到步骤</a>。</p>
<blockquote><p>导入的重点是保留文字结构，让内容继续可编辑。</p></blockquote>
<h2 id="steps">Steps / 步骤</h2>
<ol><li>检查预览</li><li>导入为新文档<ul><li>原 HTML 文件保留</li><li>另存为 Markdown</li></ul></li></ol>
<pre>const auto message = "Hello, writer";
  write(message);</pre>
<table><tr><th>内容</th><th align="right">结果</th></tr>
<tr><td>多行<br>单元格</td><td align="right">42</td></tr></table>
<p><del>旧段落</del>可以继续编辑；字面 *星号* 和 [方括号] 会正确转义。</p>
<p><a href="https://example.org/?a=1&amp;b=2">外部链接</a>保留地址。</p>
<hr>
<p>完成导入后，检查内容并保存到你选择的位置。</p>
</body>
</html>
